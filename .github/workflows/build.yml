name: AdBridge build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run integration-contract and validation tests
        run: npm test
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check manual metric review Edge Function
        run: deno check --no-lock --config supabase/functions/review-manual-metric/deno.json supabase/functions/review-manual-metric/index.ts
      - name: Type-check social OAuth and token refresh Edge Functions
        run: deno check --no-lock --config deno.json supabase/functions/social-oauth-start/index.ts supabase/functions/track-video-metrics/index.ts supabase/functions/refresh-social-credentials/index.ts
      - name: Type-check AI placement analysis Edge Function
        run: deno check --no-lock --config supabase/functions/analyze-creator-placement/deno.json supabase/functions/analyze-creator-placement/index.ts
      - name: Type-check campaign postback Edge Functions
        run: deno check --no-lock --config deno.json supabase/functions/manage-campaign-postback-secret/index.ts supabase/functions/track-conversion/index.ts supabase/functions/start-campaign-payment/index.ts supabase/functions/verify-campaign-payment/index.ts
      - name: Type-check application
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
