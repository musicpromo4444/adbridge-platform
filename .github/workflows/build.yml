name: AdBridge build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wilfmtzxxnkdcyiozamq.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: \${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - run: npm test
      - run: deno check supabase/functions/track-campaign-click/index.ts supabase/functions/track-conversion/index.ts supabase/functions/track-video-metrics/index.ts supabase/functions/review-submission/index.ts
      - run: npm run build
