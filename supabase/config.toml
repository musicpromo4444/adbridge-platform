# OAuth providers redirect to GET without a Supabase JWT. The function validates
# authenticated POST requests itself and consumes a short-lived, one-time state.
[functions.social-oauth-start]
verify_jwt = false

# Creator-triggered refreshes require a Supabase user JWT and verify creator role.
[functions.refresh-social-credentials]
verify_jwt = true
