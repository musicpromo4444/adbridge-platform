project_id = "wilfmtzxxnkdcyiozamq"

# The OAuth provider redirects to the GET callback without a Supabase JWT.
# The function validates authenticated POST requests itself and consumes a
# short-lived, one-time state value for the provider callback.
[functions.social-oauth-start]
verify_jwt = false
# Public endpoints perform their own request authentication/signature validation.
[functions.paystack-webhook]
verify_jwt = false

[functions.track-ad-event]
verify_jwt = false

[functions.track-click]
verify_jwt = false

[functions.track-conversion]
verify_jwt = false

[functions.track-all-metrics]
verify_jwt = false

[functions.track-video-metrics]
verify_jwt = false

[functions.serve-ad]
verify_jwt = false

# Admin-only endpoints require a valid Supabase user JWT and enforce admin/owner role checks.
[functions.admin-integration-readiness]
verify_jwt = true

[functions.admin-bootstrap]
verify_jwt = true
# Manual metric decisions are administrator-only and revalidated inside the Edge Function.
[functions.review-manual-metric]
verify_jwt = true
# Creator-triggered token refresh requires a valid Supabase session.
[functions.refresh-social-credentials]
verify_jwt = true

# Refund processing accepts only authenticated admins or the owning advertiser.
[functions.process-campaign-refund]
verify_jwt = true
# AI placement analysis requires an authenticated creator session.
[functions.analyze-creator-placement]
verify_jwt = true
import_map = "./functions/analyze-creator-placement/deno.json"

# Postback secret rotation is authenticated and campaign-owner checked.
[functions.manage-campaign-postback-secret]
verify_jwt = true

# Campaign funding initialization is authenticated by Supabase JWT and owner checks.
[functions.start-campaign-payment]
verify_jwt = true

# Funding verification requires an authenticated advertiser session.
[functions.verify-campaign-payment]
verify_jwt = true
